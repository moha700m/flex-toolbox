name: FlexToolbox
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  FlexToolbox:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.flextoolbox
        PRODUCT_NAME: FlexToolbox
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "عدّة فلكس"
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UILaunchStoryboardName: LaunchScreen
        UIDeviceFamily: [1]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
  FlexToolboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Core
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.flextoolbox.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  FlexToolbox:
    build:
      targets:
        FlexToolbox: all
        FlexToolboxTests: [test]
    test:
      targets:
        - FlexToolboxTests
